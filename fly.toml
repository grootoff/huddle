# fly launch --no-deploy   (then: fly volumes create huddle_data --size 3 && fly deploy)
#
# IMPORTANT: keep this to a single machine. Presence and typing state live in
# memory and the database is a local SQLite file, so a second instance would see
# a different room list. Scale up the machine, not the machine count.

app = "huddle"
primary_region = "bom"

[build]

[env]
  PORT = "4000"
  HUDDLE_DATA_DIR = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # WebSockets need the machine awake; suspend keeps it cheap without dropping state.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

# Chat history and uploaded files. Without this, a redeploy wipes both.
[[mounts]]
  source = "huddle_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
