# Netlify can host Huddle's UI, but NOT its backend: serverless functions cannot
# accept WebSocket upgrades, hold presence in memory, or keep a SQLite file and
# uploads on disk. Deploying this alone gives you a page that never connects.
#
# Set NEXT_PUBLIC_HUDDLE_SERVER (Site configuration → Environment variables) to the
# https origin of a backend running `npm start` — Fly.io, Railway, Render, a VPS, or
# your own machine behind `cloudflared tunnel --url http://localhost:4000`. It is
# read at build time, so redeploy after changing it.
#
# On that backend, set HUDDLE_ALLOWED_ORIGINS to this site's URL, e.g.
#   HUDDLE_ALLOWED_ORIGINS=https://trademohuddle.netlify.app
# otherwise the browser blocks the cross-origin socket and uploads.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
